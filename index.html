<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <svg width="200" height="200" viewBox="0 0 100 100">
        <circle class="sun" cx="20" cy="20" r="8" fill="#fcad3a" />
        <g class="tree tree1">
            <rect x="31" y="40" width="15" height="30" rx="7" fill="#46a655" />
            <rect x="36.5" y="55" width="3" height="30" fill="#6c4127"/>
            <rect x="36.5" y="55" width="3" height="7" fill="#6c4127" transform="rotate(135 36 60)"/>
        </g>
        <g class="tree tree2">
            <rect x="42" y="25" width="16" height="40" rx="8" fill="#b7f07d" />
            <rect x="48.5" y="45" width="3" height="40" fill="#6c4127" />
            <rect x="36.5" y="55" width="3" height="7" fill="#6c4127" transform="rotate(135 43 60)"/>
            <rect x="36.5" y="55" width="3" height="7" fill="#6c4127" transform="rotate(135 45 56)"/>
            <rect x="36.5" y="55" width="3" height="7" fill="#6c4127" transform="rotate(45 47 75)"/>
        </g>
        <g class="tree tree3">
            <rect x="56" y="45" width="12" height="30" rx="6" fill="#7fdc48" />
            <rect x="60.5" y="69" width="3" height="16" fill="#6c4127" />
        </g>
        <rect x="0" y="82" width="100" height="18" fill="#7fdc48" />
        <rect x="0" y="0" width="100" height="100" fill="none" stroke="#cccccc" stroke-width="2"
            stroke-dasharray="3 2" />
    </svg>
</body>

</html>
